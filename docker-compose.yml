# Portas publicadas: o gateway (8080, e 8001/8002 do painel só nesta máquina), o Kafka UI (8090)
# e o Mailpit (8025). Serviços, bancos e o Kafka ficam na rede interna do compose.
services:
  # ---------- kafka: um broker só, modo KRaft (sem ZooKeeper), fator de replicação 1 ----------
  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # o endereço que o Kafka informa aos clientes: o nome na rede do compose
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # Kafka UI: os tópicos, as mensagens (envelope, chave) e o lag de cada grupo. http://localhost:8090
  kafka-ui:
    image: kafbat/kafka-ui:v1.1.0
    environment:
      KAFKA_CLUSTERS_0_NAME: ecommerce
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8090:8080"
    depends_on:
      kafka:
        condition: service_healthy

  # Mailpit: servidor de e-mail de mentira. Caixa de entrada em http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"

  # ---------- gateway: Kong sem banco, a única porta da API ----------
  gateway:
    image: kong:3.9
    # Imagem oficial, nenhum código nosso: só o kong.yml montado como volume.
    # Ao subir, troca __JWT_SECRET__ pelo segredo e entrega o arquivo pronto ao Kong.
    entrypoint:
      - sh
      - -c
      - sed "s|__JWT_SECRET__|$${JWT_SECRET}|g" /kong/kong.yml > /tmp/kong.yml && exec /docker-entrypoint.sh kong docker-start
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /tmp/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_ADMIN_GUI_LISTEN: 0.0.0.0:8002
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      # libera o require do parser de JWT dentro do post-function (Lua em sandbox)
      KONG_UNTRUSTED_LUA_SANDBOX_REQUIRES: kong.plugins.jwt.jwt_parser
      # o DNS do Docker responde com TTL longo; um container recriado ganha outro IP e o Kong daria 502
      KONG_DNS_VALID_TTL: 10
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-em-producao}
    ports:
      - "8080:8000"           # a API da loja
      - "127.0.0.1:8001:8001" # Admin API (só nesta máquina, para conferir: curl localhost:8001/routes)
      - "127.0.0.1:8002:8002" # Kong Manager (painel, só nesta máquina)
    volumes:
      - ./kong:/kong:ro
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on: [usuarios, catalogo, pedidos]

  # ---------- usuarios: Node + Postgres ----------
  usuarios-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: usuarios
      POSTGRES_PASSWORD: usuarios
      POSTGRES_DB: usuarios
    volumes:
      - usuarios-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usuarios -d usuarios"]
      interval: 5s
      timeout: 3s
      retries: 10

  usuarios:
    build: ./usuarios
    environment:
      PORT: 3001
      DATABASE_URL: postgres://usuarios:usuarios@usuarios-db:5432/usuarios
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-em-producao}
      JWT_EXPIRES_IN: 2h
    depends_on:
      usuarios-db:
        condition: service_healthy

  # ---------- catalogo: Node + Mongo ----------
  catalogo-db:
    image: mongo:7
    volumes:
      - catalogo-dados:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  catalogo:
    build: ./catalogo
    environment:
      PORT: 3002
      MONGO_URL: mongodb://catalogo-db:27017
      MONGO_DB: catalogo
      KAFKA_BROKERS: kafka:9092
    stop_grace_period: 10s
    depends_on:
      catalogo-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ---------- pedidos: Node + Postgres (o seu próprio banco) ----------
  pedidos-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pedidos
      POSTGRES_PASSWORD: pedidos
      POSTGRES_DB: pedidos
    volumes:
      - pedidos-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pedidos -d pedidos"]
      interval: 5s
      timeout: 3s
      retries: 10

  pedidos:
    build: ./pedidos
    environment:
      PORT: 3003
      DATABASE_URL: postgres://pedidos:pedidos@pedidos-db:5432/pedidos
      # chamada direta pela rede interna, sem passar pelo gateway
      CATALOGO_URL: http://catalogo:3002
      CATALOGO_TIMEOUT_MS: 3000
      KAFKA_BROKERS: kafka:9092
    stop_grace_period: 10s
    depends_on:
      pedidos-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ---------- notificacoes: só escuta eventos e manda e-mail; sem banco, sem rota no Kong ----------
  notificacoes:
    build: ./notificacoes
    environment:
      PORT: 3004
      KAFKA_BROKERS: kafka:9092
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    stop_grace_period: 10s
    depends_on:
      kafka:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  usuarios-dados:
  catalogo-dados:
  pedidos-dados:
